<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="InkMind — Paper you can think with. A local-first computational notebook.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inkmind">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="inkmind.svg"/>

  <title>InkMind — Paper you can think with</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="position:fixed;inset:0;display:grid;place-content:center;background:#f2f1eb;color:#365c4b;font:30px Georgia;text-align:center">inkmind<span style="font:11px sans-serif;letter-spacing:2px;margin-top:16px">A LITTLE SPACE TO THINK</span></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (registrations) => {
        if (!registrations.length) return;
        await Promise.all(registrations.map((registration) => registration.unregister()));
        if (navigator.serviceWorker.controller && !sessionStorage.getItem('inkmind-sw-cleared')) {
          sessionStorage.setItem('inkmind-sw-cleared', '1');
          location.reload();
        }
      }).catch(() => {});
    }
  </script>
  <script src="inkmind_ai.js?v=ink-vision-fast-2"></script>
  <script src="flutter_bootstrap.js?v=ink-vision-fast-2" async></script>
</body>
</html>
